name: CD - Deploy to EC2

on:
  workflow_run:
    workflows:
      - "CI - Build & Push Docker Image"
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE="${{ secrets.DOCKER_USERNAME }}/myapp"
            TAG="${{ github.event.workflow_run.head_sha }}"

            # Update packages and install required software
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
            fi

            # Ensure Docker is running
            sudo systemctl enable --now docker

            # Pull the exact image built by CI
            sudo docker pull "$IMAGE:$TAG"

            # Stop and remove the previous container if it exists
            sudo docker rm -f myapp 2>/dev/null || true

            # Start the new container
            sudo docker run -d \
              --restart always \
              --name myapp \
              -p 8080:80 \
              "$IMAGE:$TAG"

            # Verify the container is running
            sudo docker ps --filter "name=myapp"

            echo "Deployment completed successfully: $IMAGE:$TAG"
